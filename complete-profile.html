<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكمل بياناتك - تبرع بالدم سوريا</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💉</text></svg>">
    <style>
        .complete-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 1rem 3rem;
        }

        .complete-card {
            background: white;
            border-radius: 25px;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        }

        .complete-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .complete-header .welcome-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .complete-header h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .complete-header p {
            color: #999;
            font-size: 0.95rem;
        }

        .user-name-display {
            background: linear-gradient(135deg, #ff4757, #ff6b7a);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .complete-form .form-group {
            margin-bottom: 1.3rem;
        }

        .complete-form label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .complete-form label .optional {
            font-size: 0.78rem;
            color: #aaa;
            font-weight: 400;
        }

        .complete-form input,
        .complete-form select {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
            color: #333;
            background: white;
        }

        .complete-form input:focus,
        .complete-form select:focus {
            outline: none;
            border-color: #ff4757;
            box-shadow: 0 0 0 3px rgba(255,71,87,0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff4757, #ff6b7a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,71,87,0.4);
        }

        .skip-btn {
            width: 100%;
            padding: 0.8rem;
            background: transparent;
            color: #999;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: all 0.3s;
        }

        .skip-btn:hover {
            background: #f8f9fa;
            color: #666;
        }

        @media (max-width: 500px) {
            .form-row { grid-template-columns: 1fr; }
            .complete-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <h2><i class="fas fa-tint"></i> تبرع بالدم - سوريا</h2>
            </div>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="importance.html">أهمية التبرع</a>
                <a href="hospitals.html">المحافظات</a>
            </div>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </nav>
    </header>

    <div class="complete-page">
        <div class="complete-card">
            <div class="complete-header">
                <div class="welcome-icon">👋</div>
                <h2>أهلاً بك!</h2>
                <p>أكمل بياناتك لتظهر بشكل كامل في ملفك الشخصي</p>
            </div>

            <div class="user-name-display" id="welcomeName">...</div>

            <form class="complete-form" id="completeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <i class="fas fa-birthday-cake" style="color:#fa7c17"></i>
                            العمر
                            <span class="optional">(اختياري)</span>
                        </label>
                        <input type="number" id="age" placeholder="مثال: 25" min="16" max="65">
                    </div>
                    <div class="form-group">
                        <label>
                            <i class="fas fa-tint" style="color:#ea4335"></i>
                            زمرة الدم
                            <span class="optional">(اختياري)</span>
                        </label>
                        <select id="bloodType">
                            <option value="">اختر زمرتك</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-map-marker-alt" style="color:#34a853"></i>
                        مكان السكن
                        <span class="optional">(اختياري)</span>
                    </label>
                    <select id="city">
                        <option value="">اختر محافظتك</option>
                        <option value="دمشق">دمشق</option>
                        <option value="حلب">حلب</option>
                        <option value="حمص">حمص</option>
                        <option value="درعا">درعا</option>
                        <option value="اللاذقية">اللاذقية</option>
                        <option value="دير الزور">دير الزور</option>
                        <option value="حماة">حماة</option>
                        <option value="إدلب">إدلب</option>
                        <option value="الرقة">الرقة</option>
                        <option value="السويداء">السويداء</option>
                        <option value="القنيطرة">القنيطرة</option>
                        <option value="طرطوس">طرطوس</option>
                        <option value="ريف دمشق">ريف دمشق</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-phone" style="color:#a142f4"></i>
                        رقم الهاتف
                        <span class="optional">(اختياري)</span>
                    </label>
                    <input type="tel" id="phone" placeholder="مثال: 0933 123 456">
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-envelope" style="color:#4285f4"></i>
                        البريد الإلكتروني
                        <span class="optional">(اختياري)</span>
                    </label>
                    <input type="email" id="email" placeholder="مثال: name@email.com">
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-check"></i> حفظ وعرض ملفي
                </button>
                <button type="button" class="skip-btn" onclick="skipProfile()">
                    تخطي الآن وأكمل لاحقاً
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const raw = sessionStorage.getItem('loggedUser');
            if (!raw) { window.location.href = 'index.html'; return; }

            const user = JSON.parse(raw);
            document.getElementById('welcomeName').textContent = '👤 ' + user.fullName;

            // Hamburger
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));
            }

            document.getElementById('completeForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const extra = {
                    age:       document.getElementById('age').value       || null,
                    bloodType: document.getElementById('bloodType').value || null,
                    city:      document.getElementById('city').value      || null,
                    phone:     document.getElementById('phone').value     || null,
                    email:     document.getElementById('email').value     || null
                };

                // حفظ البيانات بالـ localStorage مرتبطة بالمستخدم
                localStorage.setItem('profile_' + user.username, JSON.stringify(extra));

                // تحديث الـ session
                const updated = { ...user, ...extra };
                sessionStorage.setItem('loggedUser', JSON.stringify(updated));

                window.location.href = 'profile.html';
            });
        });

        function skipProfile() {
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
