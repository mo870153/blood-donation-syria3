<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - تبرع بالدم سوريا</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💉</text></svg>">
    <style>
        .book-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 100px 1rem 3rem;
        }

        .book-wrapper {
            max-width: 700px;
            margin: 0 auto;
        }

        .book-card {
            background: white;
            border-radius: 25px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        }

        .book-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .book-header .book-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .book-header h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .book-header p {
            color: #999;
            font-size: 0.95rem;
        }

        .hospital-info {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .hospital-info i {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .hospital-info-text h3 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .hospital-info-text p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .book-form .form-group {
            margin-bottom: 1.3rem;
        }

        .book-form label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .book-form label .required {
            color: #ff4757;
            font-weight: 700;
        }

        .book-form input,
        .book-form select,
        .book-form textarea {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
            color: #333;
            background: white;
        }

        .book-form input:focus,
        .book-form select:focus,
        .book-form textarea:focus {
            outline: none;
            border-color: #ff4757;
            box-shadow: 0 0 0 3px rgba(255,71,87,0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .time-slot {
            padding: 10px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            background: white;
            color: #333;
        }

        .time-slot:hover {
            border-color: #ff4757;
            background: #fff5f5;
        }

        .time-slot.selected {
            background: linear-gradient(135deg, #ff4757, #ff6b7a);
            color: white;
            border-color: #ff4757;
        }

        .time-slot.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f8f9fa;
        }

        .book-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .book-btn {
            flex: 1;
            padding: 1rem;
            background: linear-gradient(135deg, #ff4757, #ff6b7a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .book-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,71,87,0.4);
        }

        .cancel-btn {
            flex: 1;
            padding: 1rem;
            background: transparent;
            color: #999;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cancel-btn:hover {
            background: #f8f9fa;
            color: #666;
        }

        .not-logged {
            text-align: center;
            padding: 3rem 2rem;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .not-logged i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 1.5rem;
        }

        .not-logged h2 {
            color: #666;
            margin-bottom: 1rem;
        }

        .not-logged p {
            color: #999;
            margin-bottom: 2rem;
        }

        .login-btn {
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #ff4757, #ff6b7a);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,71,87,0.4);
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .success-message i {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .book-card {
                padding: 1.5rem;
            }
            .hospital-info {
                flex-direction: column;
                text-align: center;
            }
            .book-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <h2><i class="fas fa-tint"></i> تبرع بالدم - سوريا</h2>
            </div>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="importance.html">أهمية التبرع</a>
                <a href="hospitals.html">المحافظات</a>
            </div>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </nav>
    </header>

    <div class="book-page">
        <div class="book-wrapper" id="bookContent"></div>
    </div>

    <script src="book-appointment.js"></script>
</body>
</html>
