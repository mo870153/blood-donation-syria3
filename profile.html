<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي - تبرع بالدم سوريا</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💉</text></svg>">
    <style>
        .profile-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 100px 1rem 3rem;
        }
        .profile-wrapper { max-width: 800px; margin: 0 auto; }

        .profile-hero {
            background: linear-gradient(135deg, #ff4757, #ff6b7a);
            border-radius: 25px;
            padding: 2.5rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 15px 40px rgba(255,71,87,0.3);
            flex-wrap: wrap;
        }
        .avatar {
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; flex-shrink: 0;
            border: 4px solid rgba(255,255,255,0.5);
        }
        .profile-hero-info h2 { font-size: 2rem; font-weight: 700; margin-bottom: 0.3rem; }
        .profile-hero-info p { opacity: 0.9; font-size: 1rem; margin-top: 0.3rem; }
        .blood-badge {
            margin-right: auto;
            background: white; color: #ff4757;
            padding: 1rem 1.5rem; border-radius: 15px;
            text-align: center; flex-shrink: 0;
        }
        .blood-badge .blood-label { font-size: 0.85rem; color: #999; display: block; margin-bottom: 0.2rem; }
        .blood-badge .blood-value { font-size: 2rem; font-weight: 700; color: #ff4757; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem; margin-bottom: 2rem;
        }
        .info-card {
            background: white; border-radius: 18px; padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            display: flex; align-items: center; gap: 1rem;
            transition: transform 0.2s;
        }
        .info-card:hover { transform: translateY(-3px); }
        .info-icon {
            width: 55px; height: 55px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; flex-shrink: 0;
        }
        .icon-blue   { background: #e8f0fe; color: #4285f4; }
        .icon-green  { background: #e6f4ea; color: #34a853; }
        .icon-orange { background: #fef3e2; color: #fa7c17; }
        .icon-purple { background: #f3e8fd; color: #a142f4; }
        .icon-red    { background: #fce8e6; color: #ea4335; }
        .icon-gray   { background: #f1f3f4; color: #999; }

        .info-text .label { font-size: 0.82rem; color: #999; margin-bottom: 0.2rem; }
        .info-text .value { font-size: 1.1rem; font-weight: 700; color: #333; }
        .info-text .empty { font-size: 0.95rem; color: #ccc; font-weight: 400; }

        .edit-section {
            background: white; border-radius: 20px;
            padding: 1.5rem 2rem; margin-bottom: 2rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; flex-wrap: wrap;
        }
        .edit-section p { color: #666; margin: 0; }
        .edit-btn {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 10px;
            font-family: 'Cairo', sans-serif; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.5rem;
            transition: all 0.3s;
        }
        .edit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }

        .logout-btn {
            width: 100%; padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 15px;
            font-size: 1.1rem; font-weight: 600;
            font-family: 'Cairo', sans-serif; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 0.7rem; transition: all 0.3s;
        }
        .logout-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }

        .not-logged {
            text-align: center; padding: 4rem 2rem;
            background: white; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .not-logged i { font-size: 5rem; color: #ddd; margin-bottom: 1.5rem; }
        .not-logged h2 { color: #666; margin-bottom: 1rem; }

        @media (max-width: 600px) {
            .profile-hero { flex-direction: column; text-align: center; }
            .blood-badge { margin-right: 0; }
        }
    </style>
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <h2><i class="fas fa-tint"></i> تبرع بالدم - سوريا</h2>
            </div>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="importance.html">أهمية التبرع</a>
                <a href="hospitals.html">المحافظات</a>
            </div>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </nav>
    </header>

    <div class="profile-page">
        <div class="profile-wrapper" id="profileContent"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const raw = sessionStorage.getItem('loggedUser');
            const content = document.getElementById('profileContent');

            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));
            }

            if (!raw) {
                content.innerHTML = `
                    <div class="not-logged">
                        <i class="fas fa-user-lock"></i>
                        <h2>يجب تسجيل الدخول أولاً</h2>
                        <p style="color:#999; margin-bottom:2rem;">سجل دخولك لعرض ملفك الشخصي</p>
                        <a href="index.html" class="btn btn-primary" style="display:inline-flex;">
                            <i class="fas fa-sign-in-alt"></i> سجل الدخول
                        </a>
                    </div>`;
                return;
            }

            const user = JSON.parse(raw);

            // دالة مساعدة لعرض القيمة أو "غير محدد"
            function val(v, fallback) {
                return v ? `<div class="value">${v}</div>` : `<div class="empty">${fallback || 'غير محدد'}</div>`;
            }

            const bloodDisplay = user.bloodType
                ? `<div class="blood-badge"><span class="blood-label">زمرة الدم</span><div class="blood-value">${user.bloodType}</div></div>`
                : `<div class="blood-badge"><span class="blood-label">زمرة الدم</span><div class="blood-value" style="font-size:1rem;color:#ccc;">غير محددة</div></div>`;

            content.innerHTML = `
                <div class="profile-hero">
                    <div class="avatar"><i class="fas fa-user"></i></div>
                    <div class="profile-hero-info">
                        <h2>${user.fullName}</h2>
                        <p><i class="fas fa-at"></i> ${user.username}</p>
                        ${user.city ? `<p><i class="fas fa-map-marker-alt"></i> ${user.city}</p>` : ''}
                    </div>
                    ${bloodDisplay}
                </div>

                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-icon icon-blue"><i class="fas fa-user"></i></div>
                        <div class="info-text">
                            <div class="label">الاسم الكامل</div>
                            ${val(user.fullName)}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon icon-orange"><i class="fas fa-calendar-alt"></i></div>
                        <div class="info-text">
                            <div class="label">تاريخ الميلاد</div>
                            ${val(user.birthDate)}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon icon-green"><i class="fas fa-map-marker-alt"></i></div>
                        <div class="info-text">
                            <div class="label">مكان السكن</div>
                            ${val(user.city)}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon icon-red"><i class="fas fa-tint"></i></div>
                        <div class="info-text">
                            <div class="label">زمرة الدم</div>
                            ${val(user.bloodType)}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon icon-purple"><i class="fas fa-phone"></i></div>
                        <div class="info-text">
                            <div class="label">رقم الهاتف</div>
                            ${val(user.phone)}
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon icon-blue"><i class="fas fa-envelope"></i></div>
                        <div class="info-text">
                            <div class="label">البريد الإلكتروني</div>
                            ${val(user.email)}
                        </div>
                    </div>
                </div>

                <div class="edit-section">
                    <p><i class="fas fa-info-circle" style="color:#667eea"></i> بياناتك غير مكتملة؟ يمكنك تحديثها في أي وقت</p>
                    <a href="complete-profile.html" class="edit-btn">
                        <i class="fas fa-edit"></i> تعديل البيانات
                    </a>
                </div>

                <div class="appointments-section" id="appointmentsSection"></div>

                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button>
            `;

            // عرض المواعيد المحجوزة
            loadAppointments(user);
        });

        function loadAppointments(user) {
            const appointmentKey = 'appointments_' + user.username;
            const appointments = JSON.parse(localStorage.getItem(appointmentKey)) || [];
            const section = document.getElementById('appointmentsSection');

            if (appointments.length === 0) {
                section.innerHTML = `
                    <div class="no-appointments">
                        <i class="fas fa-calendar-times"></i>
                        <p>لا توجد مواعيد محجوزة حالياً</p>
                        <a href="hospitals.html" class="book-appointment-link">
                            <i class="fas fa-calendar-check"></i> احجز موعد الآن
                        </a>
                    </div>
                `;
                return;
            }

            // ترتيب المواعيد من الأحدث إلى الأقدم
            appointments.sort((a, b) => new Date(b.bookedAt) - new Date(a.bookedAt));

            let html = `<h3><i class="fas fa-calendar-check"></i> مواعيدي المحجوزة</h3>`;
            
            appointments.forEach(apt => {
                const bookedDate = new Date(apt.bookedAt);
                const formattedDate = bookedDate.toLocaleDateString('ar-SY', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });

                html += `
                    <div class="appointment-card">
                        <div class="appointment-details">
                            <div class="appointment-detail">
                                <span class="appointment-detail-label">المستشفى</span>
                                <span class="appointment-detail-value">${apt.hospital}</span>
                            </div>
                            <div class="appointment-detail">
                                <span class="appointment-detail-label">المحافظة</span>
                                <span class="appointment-detail-value">${apt.gov}</span>
                            </div>
                            <div class="appointment-detail">
                                <span class="appointment-detail-label">الموعد</span>
                                <span class="appointment-detail-value">${apt.time}</span>
                            </div>
                            <div class="appointment-detail">
                                <span class="appointment-detail-label">التاريخ</span>
                                <span class="appointment-detail-value">${apt.date}</span>
                            </div>
                            <div class="appointment-detail">
                                <span class="appointment-detail-label">رقم الهاتف</span>
                                <span class="appointment-detail-value">${apt.phone}</span>
                            </div>
                            <div class="appointment-detail">
                                <span class="appointment-detail-label">الجنس</span>
                                <span class="appointment-detail-value">${apt.gender}</span>
                            </div>
                        </div>
                        <div class="appointment-status">
                            ✓ مؤكد
                        </div>
                    </div>
                `;
            });

            section.innerHTML = html;
        }

        function logout() {
            sessionStorage.removeItem('loggedUser');
            window.location.href = 'index.html';
        }
    </script>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-logo"><i class="fas fa-tint"></i> تبرع بالدم - سوريا</div>
        <p class="footer-tagline">كل قطرة دم تنقذ حياة</p>
        <div class="footer-divider"></div>
        <p class="footer-team-title">إعداد الطلاب</p>
        <div class="footer-students">
            <div class="student-card">
                <div class="student-avatar">1</div>
                <span class="student-name">محمد معين الحلقي</span>
            </div>
            <div class="student-card">
                <div class="student-avatar">2</div>
                <span class="student-name">إسلام منير العقلة</span>
            </div>
        </div>
        <div class="footer-supervisor">
            <span class="supervisor-label">بإشراف</span>
            <span class="supervisor-name">المهندسة هبة الخطيب</span>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-university">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="80" height="80" style="margin-bottom:0.5rem">
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#c8a84b" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#c8a84b" stroke-width="1"/>
  <!-- Open book -->
  <path d="M28 68 Q60 58 60 58 Q60 58 92 68 L92 44 Q60 34 60 34 Q60 34 28 44 Z" fill="#c8a84b" opacity="0.15"/>
  <path d="M60 34 L60 68" stroke="#c8a84b" stroke-width="1.5" fill="none"/>
  <path d="M28 44 Q60 34 60 34" stroke="#c8a84b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M92 44 Q60 34 60 34" stroke="#c8a84b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M28 68 Q60 58 60 58" stroke="#c8a84b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M92 68 Q60 58 60 58" stroke="#c8a84b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="28" y1="44" x2="28" y2="68" stroke="#c8a84b" stroke-width="2"/>
  <line x1="92" y1="44" x2="92" y2="68" stroke="#c8a84b" stroke-width="2"/>
  <!-- Stars at top -->
  <text x="60" y="30" text-anchor="middle" font-size="9" fill="#c8a84b">★ ★ ★</text>
  <!-- University name Arabic -->
  <text x="60" y="86" text-anchor="middle" font-size="7.5" fill="#c8a84b" font-family="Arial">جامعة دمشق</text>
  <text x="60" y="97" text-anchor="middle" font-size="6" fill="#c8a84b" font-family="Arial">الكلية التطبيقية</text>
  <!-- Bottom decoration -->
  <text x="60" y="109" text-anchor="middle" font-size="5.5" fill="#c8a84b" font-family="Arial">Damascus University</text>
</svg>
            <div class="footer-uni-text">
                <div class="footer-uni-name">جامعة دمشق</div>
                <div class="footer-uni-sub">الكلية التقنية التطبيقية</div>
            </div>
        </div>
        <div class="footer-bottom">© 2026 تبرع بالدم سوريا · جميع الحقوق محفوظة</div>
    </footer>

</body>
</html>
